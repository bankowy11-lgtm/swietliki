<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b22">
<title>Świetliki</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Nocna polana: granat, ciepłe światło świetlików, szkło. Plansza w środku, liczniki u góry, narzędzia na dole. */
  :root {
    --night: #070b22; --night-2: #101a48; --ink: #eef1ff; --muted: #aab3e6; --dim: #6f78a8;
    --glow: #ffcf4a; --glow-ink: #2a1f00; --cyan: #5cf2ff; --glass: rgba(170,195,255,.08); --line: rgba(190,210,255,.16);
    --display: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; --ui: system-ui, "Segoe UI", Roboto, sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--night); overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: var(--ui); color: var(--ink); }
  #cv { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  button { font-family: var(--ui); color: var(--ink); cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* górny pasek: dźwięk · liczniki · menu */
  #top { position: fixed; top: 0; left: 0; right: 0; display: grid; grid-template-columns: 44px 1fr 44px; align-items: start; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
    pointer-events: none; transition: opacity .3s; }
  #top > * { pointer-events: auto; }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); font-size: 18px; display: grid; place-items: center; }
  .round:active { transform: scale(.94); }
  .stats { display: flex; justify-content: center; gap: 5px; min-width: 0; }
  .stat { flex: 1 1 0; min-width: 0; max-width: 78px; padding: 5px 4px 6px; border-radius: 14px; background: rgba(10,16,48,.55); border: 1px solid var(--line); text-align: center; }
  .winstats .stat { flex: 0 0 76px; }
  .stat small { display: block; font-size: 9px; letter-spacing: .8px; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stat b { display: block; font: 800 20px/1.1 var(--display); color: var(--ink); font-variant-numeric: tabular-nums; }
  .stat.lv b { color: #ffe9a8; text-shadow: 0 0 12px rgba(255,207,74,.7); }
  #chap { grid-column: 1 / -1; text-align: center; font-size: 11px; letter-spacing: 1.2px; color: var(--dim); text-transform: uppercase; font-weight: 700; margin-top: -2px; }

  /* dolny pasek narzędzi */
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 8px;
    padding: 0 max(12px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); transition: opacity .3s; }
  .tool { position: relative; width: 74px; padding: 8px 4px 7px; border-radius: 16px; border: 1px solid var(--line); background: rgba(10,16,48,.6);
    display: grid; justify-items: center; gap: 2px; font-size: 11.5px; font-weight: 700; }
  .tool .i { font-size: 19px; line-height: 1.1; }
  .tool:active { transform: scale(.95); }
  .tool[disabled] { opacity: .35; }
  .tool .n { position: absolute; top: -6px; right: -4px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--glow); color: var(--glow-ink);
    font-size: 11px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; box-sizing: border-box; }
  .tool.hint { border-color: rgba(92,242,255,.45); }

  #toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translate(-50%, 10px); opacity: 0;
    padding: 9px 14px; border-radius: 14px; background: rgba(10,16,48,.92); border: 1px solid var(--line); font-size: 13.5px; font-weight: 600;
    max-width: min(320px, calc(100vw - 32px)); text-align: center; transition: opacity .25s, transform .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* nakładki */
  .ov { position: fixed; inset: 0; display: none; place-items: center; background: rgba(4,7,22,.8);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; scrollbar-width: none; }
  .ov::-webkit-scrollbar { display: none; }
  .ov.show { display: grid; }
  .card { text-align: center; padding: calc(22px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    max-width: 360px; width: 100%; box-sizing: border-box; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--cyan); font-weight: 800; }
  .card h1 { margin: 4px 0 6px; font: 800 48px/1 var(--display); color: #ffe9a8; letter-spacing: 1px; text-shadow: 0 0 22px var(--glow), 0 0 54px #ffb000; }
  .card h2 { margin: 2px 0 8px; font: 800 30px/1.1 var(--display); color: #ffe9a8; text-shadow: 0 0 18px var(--glow); text-wrap: balance; }
  .card p { color: #c3c9f0; margin: 8px 0 18px; line-height: 1.45; font-size: 15px; }
  .big { background: var(--glow); color: var(--glow-ink); border: 0; border-radius: 22px; padding: 14px 34px;
    font: 800 19px var(--ui); box-shadow: 0 0 26px rgba(255,207,74,.55); }
  .big:active { transform: scale(.96); }
  .link { background: none; border: 0; color: var(--muted); font-weight: 700; font-size: 14px; padding: 12px; }

  .stars { display: flex; justify-content: center; gap: 10px; margin: 8px 0 4px; font-size: 42px; line-height: 1; }
  .stars span { color: #2c3466; }
  .stars span.on { color: var(--glow); text-shadow: 0 0 16px var(--glow); animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
  .stars span.on:nth-child(2) { animation-delay: .18s; } .stars span.on:nth-child(3) { animation-delay: .36s; }
  @keyframes pop { from { transform: scale(0) rotate(-40deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .winstats { display: flex; justify-content: center; gap: 8px; margin: 12px 0 16px; }

  /* mapa poziomów */
  .chapters { display: grid; gap: 8px; margin: 18px 0 4px; text-align: left; }
  .ch { background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 9px 12px; }
  .ch.cur { border-color: rgba(255,207,74,.75); background: rgba(255,207,74,.08); }
  .ch.lock { opacity: .5; }
  .ch .t { display: flex; justify-content: space-between; align-items: baseline; font-weight: 700; font-size: 14px; gap: 8px; }
  .ch .t span:last-child { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 13px; }
  .ch .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ch button.head { all: unset; display: block; width: 100%; cursor: pointer; }
  .bar { height: 5px; background: rgba(0,0,0,.4); border-radius: 3px; margin-top: 7px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--glow); border-radius: 3px; box-shadow: 0 0 8px var(--glow); }
  .levels { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 10px; }
  .levels button { border: 1px solid var(--line); background: rgba(10,16,48,.7); border-radius: 12px; padding: 7px 0 5px; font: 800 15px var(--display);
    font-variant-numeric: tabular-nums; display: grid; gap: 1px; }
  .levels button small { font-size: 9px; letter-spacing: 1px; color: var(--glow); font-family: var(--ui); }
  .levels button.now { border-color: var(--glow); box-shadow: 0 0 12px rgba(255,207,74,.35); }
  .levels button[disabled] { opacity: .3; }

  .new { font-size: 12px; font-weight: 800; letter-spacing: 3px; color: var(--cyan); text-transform: uppercase; }
  .demo { width: 160px; height: 120px; margin: 6px auto 0; display: block; }
  @media (prefers-reduced-motion: reduce) { .stars span.on { animation: none; } #toast { transition: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <button class="round" id="snd" aria-label="Dźwięk">🔊</button>
  <div class="stats">
    <div class="stat lv"><small id="lvlL">Poziom</small><b id="lvl">1</b></div>
    <div class="stat"><small id="movesL">Ruchy</small><b id="moves">0</b></div>
    <div class="stat"><small id="progL">Postęp</small><b id="prog">0%</b></div>
  </div>
  <button class="round" id="menuBtn" aria-label="Menu">☰</button>
  <div id="chap"></div>
</div>
<div id="bottom">
  <button class="tool" id="undo"><span class="i">↶</span><span id="undoL">Cofnij</span><span class="n" id="undoN">5</span></button>
  <button class="tool" id="restart"><span class="i">↻</span><span id="restartL">Od nowa</span></button>
  <button class="tool hint" id="hintBtn"><span class="i">✦</span><span id="hintL">Podpowiedź</span><span class="n" id="hintN">3</span></button>
  <button class="tool" id="addJar"><span class="i">＋</span><span id="jarL">Słoik</span><span class="n" id="jarN">1</span></button>
</div>
<div id="toast" role="status"></div>

<div class="ov show" id="menu"><div class="card">
  <div class="eyebrow" id="tagline">Magiczna łamigłówka</div>
  <h1 id="title">Świetliki</h1>
  <p id="howto">Przenoś świetliki między słoikami. Do świetlika możesz dołożyć tylko taki sam kolor. Zbierz każdy kolor w osobnym słoiku!</p>
  <button class="big" id="play">Graj</button>
  <div class="chapters" id="chapters"></div>
</div></div>

<div class="ov" id="intro"><div class="card">
  <div class="new" id="newL">Nowość</div>
  <h2 id="introT"></h2>
  <canvas class="demo" id="demo" width="320" height="240"></canvas>
  <p id="introP"></p>
  <button class="big" id="introGo">Rozumiem</button>
</div></div>

<div class="ov" id="win"><div class="card">
  <div class="eyebrow" id="winEyebrow"></div>
  <h2 id="winT">Pięknie świeci!</h2>
  <div class="stars" id="winStars"><span>★</span><span>★</span><span>★</span></div>
  <div class="winstats">
    <div class="stat"><small id="wMovesL">Ruchy</small><b id="wMoves">0</b></div>
    <div class="stat"><small id="wParL">Na 3 ★</small><b id="wPar">0</b></div>
    <div class="stat"><small id="wTotalL">Gwiazdki</small><b id="wTotal">0</b></div>
  </div>
  <p id="winInfo"></p>
  <button class="big" id="next">Następny poziom</button>
  <div><button class="link" id="again">↻ <span id="againL">Zagraj jeszcze raz</span></button></div>
</div></div>

<script>
'use strict';
const CAP = 4, MAX_LEVEL = 100, HINTS = 3;
// język: polski dla telefonów ustawionych na polski, dla wszystkich innych angielski
const LANG = (navigator.languages && navigator.languages[0] || navigator.language || 'en').toLowerCase().startsWith('pl') ? 'pl' : 'en';
const tr = (pl, en) => LANG === 'pl' ? pl : en;
document.documentElement.lang = LANG;
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COLORS = ['#ffd84a', '#5cf2ff', '#ff5c8a', '#8cff6a', '#b98cff', '#ff9a3c', '#4a8cff', '#f4f4ff', '#ff4ad8', '#3cffb4', '#d9b26a', '#ff3c3c'];
const CHAPTERS = [
  { name: tr('Polana', 'Meadow'), note: tr('pierwsze świetliki', 'your first fireflies') },
  { name: tr('Mgła', 'Mist'), note: tr('część świetlików śpi', 'some fireflies are asleep'), feature: 'hidden',
    title: tr('Śpiące świetliki', 'Sleeping fireflies'),
    text: tr('Szare świetliki śpią we mgle. Obudzą się i pokażą kolor, gdy znajdą się na samej górze słoika.',
      'Grey fireflies are asleep in the mist. They wake up and show their colour when they reach the top of a jar.') },
  { name: tr('Szron', 'Frost'), note: tr('zamrożony słoik', 'a frozen jar'), feature: 'frozen',
    title: tr('Zamrożony słoik', 'Frozen jar'),
    text: tr('Oszroniony słoik jest zamknięty. Odtaje, gdy napełnisz tyle słoików jednym kolorem, ile pokazuje płatek śniegu.',
      'A frosted jar is locked. It thaws once you fill as many jars with a single colour as the snowflake shows.') },
  { name: tr('Stary sad', 'Old Orchard'), note: tr('więcej kolorów', 'more colours') },
  { name: tr('Mokradła', 'Marshes'), note: tr('gęstsza mgła', 'thicker mist') },
  { name: tr('Łąka nocą', 'Night Field'), note: tr('szron i mgła razem', 'frost and mist together') },
  { name: tr('Wzgórze', 'Hilltop'), note: tr('dziesięć kolorów', 'ten colours') },
  { name: tr('Brzozowy gaj', 'Birch Grove'), note: tr('jedenaście kolorów', 'eleven colours') },
  { name: tr('Mleczna Droga', 'Milky Way'), note: tr('pełna tęcza', 'the full rainbow') },
  { name: tr('Gwiazdozbiór', 'Constellation'), note: tr('ostatni sprawdzian', 'the final test') },
];
const chapterOf = lv => Math.min(Math.floor((lv - 1) / 10), CHAPTERS.length - 1);
const featureFrom = f => CHAPTERS.findIndex(c => c.feature === f) * 10 + 1;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');

// --- zapis ---
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
// level = najwyższy odblokowany poziom, playing = poziom, który właśnie gramy (można wracać do ukończonych)
let level = store.get('sw_level', 1), playing = level, muted = store.get('sw_muted', false);
let starsBy = store.get('sw_starsBy', {}), seen = store.get('sw_seen', []), openChapter = -1;
const totalStars = () => Object.values(starsBy).reduce((a, b) => a + b, 0);

// --- dźwięk (Web Audio, bez plików) ---
let actx = null;
function audio() {
  if (muted) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur = .18, type = 'sine', vol = .12, delay = 0) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760, 2093, 2349];
const S = {
  pick: c => tone(SCALE[c] / 2, .12, 'triangle', .08),
  drop: c => tone(SCALE[c], .22, 'sine', .1),
  bad: () => { tone(180, .12, 'square', .05); tone(150, .14, 'square', .05, .06); },
  wake: () => tone(1900, .15, 'sine', .05),
  hint: () => { tone(1319, .18, 'sine', .06); tone(1760, .25, 'sine', .05, .08); },
  thaw: () => [1568, 1319, 1047].forEach((f, i) => tone(f, .25, 'sine', .06, i * .06)),
  full: () => [0, 2, 4].forEach((s, i) => tone(SCALE[s + 3], .3, 'sine', .08, i * .07)),
  win: () => [0, 2, 4, 7, 9].forEach((s, i) => tone(SCALE[s], .45, 'triangle', .09, i * .1)),
  star: i => tone(SCALE[4 + i * 2], .3, 'triangle', .08),
};
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

// --- poziomy ---
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }
function params(lv) {
  return {
    k: Math.min(3 + Math.floor((lv - 1) / 7), COLORS.length),
    pHidden: lv >= featureFrom('hidden') ? Math.min(.3 + (lv - featureFrom('hidden')) * .008, .75) : 0,
    frozen: lv >= featureFrom('frozen') && (lv < featureFrom('frozen') + 10 || lv % 3 !== 0),
  };
}
const isFull = A => A.length === CAP && A.every(c => c === A[0]);
const fullCount = (J, skip) => J.reduce((n, a, i) => n + (i !== skip && isFull(a) ? 1 : 0), 0);
function isDone(J) { return J.every(a => a.length === 0 || isFull(a)); }

// DFS szuka rozwiązania (z limitem). Zwraca listę ruchów [[skąd, dokąd], …] (pustą, gdy już ułożone) albo null, gdy brak.
// Służy do sprawdzania nowych poziomów i do podpowiedzi. fz = zamrożony słoik, need = ile pełnych słoików go rozmraża.
// M0 = maska śpiących świetlików: tak jak u gracza, śpiący nie rusza się razem z resztą, dopóki nie trafi na górę.
function solve(J0, fz = -1, need = 0, limit = 40000, M0 = null) {
  const seenK = new Set(); let n = 0;
  const enc = (a, m) => a.map((c, i) => String.fromCharCode((m && m[i] ? 97 : 65) + c)).join('');
  function dfs(J, M) {
    if (isDone(J)) return [];
    if (++n > limit) return null;
    const open = fz < 0 || fullCount(J, fz) >= need;
    const k = (open ? '' : enc(J[fz], M && M[fz]) + '#') + J.map((a, i) => open || i !== fz ? enc(a, M && M[i]) : null).filter(x => x !== null).sort().join('|');
    if (seenK.has(k)) return null; seenK.add(k);
    for (let a = 0; a < J.length; a++) {
      if (!open && a === fz) continue;
      const A = J[a]; if (!A.length || isFull(A)) continue;
      const c = A[A.length - 1];
      let run = 1; while (run < A.length && A[A.length - 1 - run] === c && !(M && M[a][A.length - 1 - run])) run++;
      for (let b = 0; b < J.length; b++) {
        if (a === b || (!open && b === fz)) continue;
        const B = J[b];
        if (B.length >= CAP || (B.length && B[B.length - 1] !== c) || (!B.length && run === A.length)) continue;
        const m = Math.min(run, CAP - B.length), N = J.map(x => x.slice()), NM = M && M.map(x => x.slice());
        for (let i = 0; i < m; i++) { N[b].push(N[a].pop()); if (NM) { NM[a].pop(); NM[b].push(false); } }
        if (NM && NM[a].length) NM[a][NM[a].length - 1] = false;  // nowy wierzch się budzi
        const path = dfs(N, NM);
        if (path) return [[a, b], ...path];
      }
    }
    return null;
  }
  return dfs(J0.map(a => a.slice()), M0 && M0.map(a => a.slice()));
}

function makeLevel(lv) {
  const { k, pHidden, frozen } = params(lv), r = rng(lv * 7919 + 17);
  for (let tries = 0; tries < 300; tries++) {
    const pool = [];
    for (let c = 0; c < k; c++) for (let i = 0; i < CAP; i++) pool.push(c);
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const J = [];
    for (let i = 0; i < k; i++) J.push(pool.slice(i * CAP, i * CAP + CAP));
    J.push([], []);
    if (J.some(isFull)) continue;
    const fz = frozen ? Math.floor(r() * k) : -1, need = frozen ? (k >= 7 && r() < .5 ? 2 : 1) : 0;
    if (!solve(J, fz, need)) continue;
    const mask = J.map(a => a.map((_, s) => s < a.length - 1 && r() < pHidden));
    return { J, mask, fz, need };
  }
  const J = []; for (let i = 0; i < k; i++) J.push(Array(CAP).fill(i)); J.push([], []);
  return { J, mask: J.map(a => a.map(() => false)), fz: -1, need: 0 }; // awaryjnie
}

// --- stan gry ---
let jars = [], mask = [], fz = -1, need = 0, sel = -1, moves = 0, history = [], undoLeft = 5, jarLeft = 1, hintLeft = HINTS, state = 'menu';
let flying = [], hidden = new Map(), shakes = new Map(), glows = new Map(), particles = [], rings = [], thawT = 0, hint = null, celebrateT = 0;

function startLevel(lv = playing) {
  playing = lv;
  const Lv = makeLevel(lv);
  jars = Lv.J; mask = Lv.mask; fz = Lv.fz; need = Lv.need;
  sel = -1; moves = 0; history = []; undoLeft = 5; jarLeft = 1; hintLeft = HINTS; thawT = 0; hint = null; celebrateT = 0;
  flying = []; hidden.clear(); shakes.clear(); glows.clear(); particles = []; rings = [];
  state = 'play'; layout(); hud();
}
const frozenNow = j => j === fz && fz >= 0 && fullCount(jars, fz) < need;
const progress = () => { const k = params(playing).k; return Math.round(fullCount(jars, -1) / k * 100); };
function hud() {
  $('lvl').textContent = String(playing).padStart(2, '0');
  $('moves').textContent = moves;
  $('prog').textContent = (jars.length ? progress() : 0) + '%';
  $('chap').textContent = CHAPTERS[chapterOf(playing)].name;
  $('undoN').textContent = undoLeft; $('jarN').textContent = jarLeft; $('hintN').textContent = hintLeft;
  $('undo').disabled = !undoLeft || !history.length;
  $('addJar').disabled = !jarLeft;
  $('hintBtn').disabled = !hintLeft;
  $('snd').textContent = muted ? '🔇' : '🔊';
  const inGame = state === 'play' || state === 'celebrate';
  $('top').style.opacity = $('bottom').style.opacity = inGame ? 1 : 0;
}
let toastT = 0;
function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2200);
}

// --- układ słoików ---
let W = 0, H = 0, DPR = 1, L = { pos: [], jw: 0, jh: 0, d: 0 }, bgCanvas = null;
function layout() {
  const n = jars.length;
  const rows = n > 6 ? 2 : 1, per = Math.ceil(n / rows);
  const top = 112, bottom = 104, areaH = H - top - bottom;
  let jw = Math.min(72, (W - 24) / per * .74);
  let d = jw * .74, jh = d * CAP + jw * .55;
  const maxJh = areaH / rows * .78;
  if (jh > maxJh) { const s = maxJh / jh; jw *= s; d *= s; jh = maxJh; }
  L = { pos: [], jw, jh, d };
  for (let i = 0; i < n; i++) {
    const row = Math.floor(i / per), inRow = row === rows - 1 ? n - per * (rows - 1) : per, col = i - row * per;
    const gx = (W - inRow * jw) / (inRow + 1);
    L.pos.push({ x: gx + col * (jw + gx), y: top + areaH / rows * row + (areaH / rows - jh) / 2 + 20 });
  }
}
function slotXY(j, s) {
  const p = L.pos[j];
  return { x: p.x + L.jw / 2, y: p.y + L.jh - L.d * .62 - s * L.d * .98 };
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildBg(); if (jars.length) layout();
}
addEventListener('resize', resize);

function buildBg() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width = W * DPR; bgCanvas.height = H * DPR;
  const b = bgCanvas.getContext('2d'); b.setTransform(DPR, 0, 0, DPR, 0, 0);
  const g = b.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#05081c'); g.addColorStop(.55, '#0d1640'); g.addColorStop(1, '#16255a');
  b.fillStyle = g; b.fillRect(0, 0, W, H);
  const r = rng(42);
  for (let i = 0; i < 140; i++) { b.globalAlpha = r() * .7 + .1; b.fillStyle = '#fff'; const s = r() * 1.6 + .4; b.fillRect(r() * W, r() * H * .65, s, s); }
  b.globalAlpha = 1;
  // księżyc z poświatą
  const mx = W * .84, my = H * .2, mr = Math.min(W, H) * .055;
  const mg = b.createRadialGradient(mx, my, mr * .3, mx, my, mr * 5);
  mg.addColorStop(0, 'rgba(255,240,200,.22)'); mg.addColorStop(1, 'rgba(255,240,200,0)');
  b.fillStyle = mg; b.fillRect(0, 0, W, H);
  b.fillStyle = '#fff3cf'; b.beginPath(); b.arc(mx, my, mr, 0, 7); b.fill();
  b.fillStyle = '#080d28'; b.beginPath(); b.arc(mx + mr * .45, my - mr * .2, mr * .9, 0, 7); b.fill();
  // dwa pasma wzgórz i trawa
  const hill = (base, amp, col) => { b.fillStyle = col; b.beginPath(); b.moveTo(0, H); for (let x = 0; x <= W; x += 8) b.lineTo(x, H - base - Math.sin(x / W * 5 + base) * amp); b.lineTo(W, H); b.fill(); };
  hill(130, 18, '#0b143a'); hill(80, 14, '#081030');
  b.fillStyle = '#050818';
  b.beginPath(); b.moveTo(0, H);
  for (let x = 0; x <= W; x += 5) b.lineTo(x, H - 28 - Math.abs(Math.sin(x * .37) * 20) - r() * 14);
  b.lineTo(W, H); b.fill();
}

// drobinki światła unoszące się w tle
const motes = Array.from({ length: REDUCED ? 12 : 42 }, () => ({ x: Math.random(), y: Math.random(), s: .2 + Math.random() * .8, p: Math.random() * 7,
  c: ['#ffe9a8', '#fff6c8', '#cfe9ff', '#ffd84a'][Math.floor(Math.random() * 4)] }));
function drawAmbient(t) {
  for (const m of motes) {
    m.y -= .00012 * m.s * 16; m.x += Math.sin(t / 2000 + m.p) * .00008;
    if (m.y < -.02) { m.y = 1.02; m.x = Math.random(); }
    const a = (.25 + .35 * Math.sin(t / 700 + m.p * 3)) * m.s, x = m.x * W, y = m.y * H, rad = 1 + m.s * 2.2;
    const g = ctx.createRadialGradient(x, y, 0, x, y, rad * 4);
    g.addColorStop(0, m.c); g.addColorStop(1, 'rgba(255,240,200,0)');
    ctx.globalAlpha = Math.max(0, a); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, rad * 4, 0, 7); ctx.fill();
  }
  // mgła dryfująca nad trawą
  for (let i = 0; i < 2; i++) {
    const fx = ((t / (26000 + i * 9000)) % 1) * (W + 600) - 300, fy = H - 70 - i * 46;
    const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 260);
    g.addColorStop(0, 'rgba(150,170,230,.10)'); g.addColorStop(1, 'rgba(150,170,230,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(fx - 300, fy - 120, 600, 240);
  }
  ctx.globalAlpha = 1;
}

// --- logika ruchu ---
function topRun(j) {
  const A = jars[j], M = mask[j]; if (!A.length) return 0;
  const c = A[A.length - 1]; let r = 1;
  while (r < A.length && A[A.length - 1 - r] === c && !M[A.length - 1 - r]) r++;
  return r;
}
function wakeTop(j) {
  const M = mask[j];
  if (M.length && M[M.length - 1]) {
    M[M.length - 1] = false; S.wake();
    const p = slotXY(j, M.length - 1), c = COLORS[jars[j][M.length - 1]];
    for (let i = 0; i < 10; i++) particles.push({ x: p.x, y: p.y, vx: (Math.random() - .5) * 3, vy: -Math.random() * 2.5, life: .8, c });
    rings.push({ x: p.x, y: p.y, c, t0: performance.now() });
  }
}

function tapJar(j) {
  if (state !== 'play') return;
  audio();
  const A = jars[j];
  if (frozenNow(j)) { shake(j); S.bad(); buzz(20); toast(tr('Ten słoik jest zamrożony. Napełnij najpierw inny słoik jednym kolorem.', 'This jar is frozen. Fill another jar with one colour first.')); return; }
  if (sel === -1) {
    if (!A.length || isFull(A)) { shake(j); return; }
    sel = j; S.pick(A[A.length - 1]); return;
  }
  if (sel === j) { sel = -1; return; }
  const from = jars[sel], c = from[from.length - 1];
  if (A.length >= CAP || (A.length && A[A.length - 1] !== c)) {
    shake(j); S.bad(); buzz(25);
    toast(A.length >= CAP ? tr('Ten słoik jest pełny.', 'That jar is full.') : tr('Świetlik pasuje tylko do takiego samego koloru albo pustego słoika.', 'A firefly only goes on the same colour or into an empty jar.'));
    if (A.length && !isFull(A)) { sel = j; S.pick(A[A.length - 1]); } else sel = -1;
    return;
  }
  const m = Math.min(topRun(sel), CAP - A.length);
  history.push({ jars: jars.map(a => a.slice()), mask: mask.map(a => a.slice()) });
  const now = performance.now();
  for (let i = 0; i < m; i++) {
    const fs = from.length - 1, ts = A.length;
    const p0 = slotXY(sel, fs), p1 = slotXY(j, ts);
    p0.y = L.pos[sel].y - L.d * .7;
    const key = j + ':' + ts;
    hidden.set(key, (hidden.get(key) || 0) + 1);
    flying.push({ c, p0, p1, t0: now + i * 90, dur: 380, key, jar: j });
    A.push(from.pop()); mask[sel].pop(); mask[j].push(false);
  }
  wakeTop(sel);
  followedPlan(sel, j);
  sel = -1; hint = null; moves++; hud();
}
function shake(j) { shakes.set(j, performance.now()); }

function landed(f) {
  const n = hidden.get(f.key) - 1; if (n > 0) hidden.set(f.key, n); else hidden.delete(f.key);
  S.drop(f.c); buzz(8);
  rings.push({ x: f.p1.x, y: f.p1.y, c: COLORS[f.c], t0: performance.now() });  // rozbłysk po poprawnym ruchu
  const A = jars[f.jar];
  if (!flying.some(o => o !== f && o.jar === f.jar) && isFull(A)) {
    glows.set(f.jar, performance.now()); S.full(); buzz([15, 40, 15]);
    const p = L.pos[f.jar];
    for (let i = 0; i < 26; i++) particles.push({ x: p.x + L.jw / 2, y: p.y + L.jh / 2, vx: (Math.random() - .5) * 4, vy: -Math.random() * 4 - 1, life: 1, c: COLORS[A[0]] });
    if (fz >= 0 && !thawT && !frozenNow(fz)) { thawT = performance.now(); S.thaw(); }
  }
  hud();
  if (!flying.some(o => o !== f) && isDone(jars) && state === 'play') celebrate();
}

// krótka animacja zwycięstwa: słoiki rozbłyskują, świetliki wylatują w górę, potem ekran z oceną
function celebrate() {
  state = 'celebrate'; celebrateT = performance.now(); S.win(); buzz([20, 60, 20, 60, 40]);
  jars.forEach((A, j) => {
    if (!A.length) return;
    const p = L.pos[j];
    for (let i = 0; i < 18; i++) particles.push({ x: p.x + L.jw / 2 + (Math.random() - .5) * L.jw * .6, y: p.y + L.jh * (.2 + Math.random() * .7),
      vx: (Math.random() - .5) * 1.6, vy: -2.5 - Math.random() * 3.5, life: 1.4, c: COLORS[A[0]], up: true });
  });
  hud();
  setTimeout(win, REDUCED ? 300 : 1300);
}

function plural(n) { if (LANG !== 'pl') return n === 1 ? 'move' : 'moves'; return n === 1 ? 'ruch' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'ruchy' : 'ruchów'; }
const parOf = lv => Math.round(params(lv).k * 2.6 + (params(lv).frozen ? 2 : 0));
function win() {
  if (state !== 'celebrate' && state !== 'play') return;
  state = 'win';
  const par = parOf(playing);
  const stars = moves <= par ? 3 : moves <= par * 1.5 ? 2 : 1;
  const before = starsBy[playing] || 0;
  starsBy[playing] = Math.max(before, stars);
  const done = playing;
  if (playing === level) level++;
  store.set('sw_level', level); store.set('sw_starsBy', starsBy);
  const chapterDone = done % 10 === 0 && done <= MAX_LEVEL && done === level - 1;
  $('winEyebrow').textContent = tr('Poziom ', 'Level ') + done;
  $('winT').textContent = chapterDone ? tr('Rozdział ukończony!', 'Chapter complete!') : [tr('Pięknie świeci!', 'What a glow!'), tr('Świetnie!', 'Great job!'), tr('Brawo!', 'Well done!')][stars - 1 === 2 ? 0 : stars === 2 ? 1 : 2];
  [...$('winStars').children].forEach((s, i) => { s.classList.remove('on'); void s.offsetWidth; if (i < stars) s.classList.add('on'); });
  for (let i = 0; i < stars; i++) setTimeout(() => S.star(i), 200 + i * 180);
  $('wMoves').textContent = moves; $('wPar').textContent = '≤ ' + par; $('wTotal').textContent = totalStars();
  $('winInfo').textContent = chapterDone
    ? (done === MAX_LEVEL ? tr('Wszystkie 100 poziomów za Tobą! Dalej czekają poziomy bez końca.', 'All 100 levels done! Endless levels await.')
      : tr(`„${CHAPTERS[chapterOf(done)].name}” zaliczona. Następny rozdział: „${CHAPTERS[chapterOf(done + 1)].name}”.`, `“${CHAPTERS[chapterOf(done)].name}” complete. Next chapter: “${CHAPTERS[chapterOf(done + 1)].name}”.`))
    : stars < 3 ? tr(`Ułóż w ${par} ${plural(par)} albo mniej, żeby zdobyć 3 gwiazdki.`, `Finish in ${par} ${plural(par)} or fewer for 3 stars.`)
    : before === 3 ? tr('Znowu trzy gwiazdki!', 'Three stars again!') : tr('Trzy gwiazdki za mało ruchów!', 'Three stars for so few moves!');
  $('win').classList.add('show'); hud();
}

function undo() {
  if (!undoLeft || !history.length || flying.length || state !== 'play') return;
  const h = history.pop(); jars = h.jars; mask = h.mask;
  undoLeft--; sel = -1; hint = null; moves++; hidden.clear(); layout(); hud();
}
function addJar() {
  if (!jarLeft || flying.length || state !== 'play') return;
  history.push({ jars: jars.map(a => a.slice()), mask: mask.map(a => a.slice()) });
  jars.push([]); mask.push([]); jarLeft--; sel = -1; hint = null; layout(); hud(); tone(660, .2, 'sine', .08);
}
// podpowiedź trzyma się jednego planu, dopóki gracz go wykonuje (inaczej kolejne podpowiedzi mogłyby kręcić się w kółko)
let plan = null;
const stateKey = () => JSON.stringify([jars, mask]);
function nextMove() {
  if (!plan || plan.key !== stateKey() || plan.i >= plan.moves.length) {
    const moves = solve(jars, frozenNow(fz) ? fz : -1, need, 120000, mask);
    plan = moves && moves.length ? { moves, i: 0, key: stateKey() } : null;
  }
  return plan && plan.moves[plan.i];
}
function followedPlan(a, b) {
  if (plan && plan.moves[plan.i] && plan.moves[plan.i][0] === a && plan.moves[plan.i][1] === b) { plan.i++; plan.key = stateKey(); }
  else plan = null;
}
function useHint() {
  if (!hintLeft || flying.length || state !== 'play') return;
  audio();
  const mv = nextMove();
  if (!mv) {
    toast(tr('Stąd nie da się już ułożyć. Cofnij ruch albo zacznij od nowa.', 'This can’t be solved from here. Undo a move or restart.')); S.bad();
    return;
  }
  hintLeft--; sel = -1; hint = { a: mv[0], b: mv[1], t0: performance.now() }; S.hint(); hud();
}

// --- ekrany ---
function chapterRows(el, onlyCurrent) {
  const cur = chapterOf(level);
  const list = onlyCurrent ? [chapterOf(playing)] : CHAPTERS.map((_, i) => i);
  el.innerHTML = list.map(i => {
    const c = CHAPTERS[i], done = Math.max(0, Math.min(10, level - 1 - i * 10)), lock = i > cur;
    let st = 0; for (let l = i * 10 + 1; l <= i * 10 + 10; l++) st += starsBy[l] || 0;
    const open = !onlyCurrent && !lock && openChapter === i;
    const grid = open ? `<div class="levels">${Array.from({ length: 10 }, (_, k) => {
      const lv = i * 10 + k + 1, s = starsBy[lv] || 0;
      return `<button data-lv="${lv}" class="${lv === level ? 'now' : ''}" ${lv > level ? 'disabled' : ''}>${lv}<small>${s ? '★'.repeat(s) : lv === level ? '•' : '&nbsp;'}</small></button>`;
    }).join('')}</div>` : '';
    return `<div class="ch${i === cur ? ' cur' : ''}${lock ? ' lock' : ''}">
      <button class="head" data-ch="${i}" ${lock || onlyCurrent ? 'tabindex="-1"' : ''}>
      <div class="t"><span>${lock ? '🔒 ' : done === 10 ? '✓ ' : ''}${c.name}</span><span>${lock ? tr('poz. ', 'lv. ') + (i * 10 + 1) + '–' + (i * 10 + 10) : '★ ' + st + ' / 30'}</span></div>
      <div class="s">${c.note}</div>${lock ? '' : `<div class="bar"><i style="width:${done * 10}%"></i></div>`}</button>${grid}</div>`;
  }).join('') + (level > MAX_LEVEL ? `<div class="ch cur"><div class="t"><span>${tr('Bez końca', 'Endless')}</span><span>${tr('poz. ', 'lv. ')}${level}</span></div><div class="s">${tr('wszystkie rozdziały ukończone', 'all chapters complete')}</div></div>` : '');
}
function showMenu() {
  state = 'menu'; sel = -1;
  if (openChapter < 0) openChapter = Math.min(chapterOf(level), CHAPTERS.length - 1);
  $('play').textContent = level > 1 ? tr('Graj · poziom ', 'Play · level ') + level : tr('Graj', 'Play');
  chapterRows($('chapters'), false);
  $('win').classList.remove('show'); $('menu').classList.add('show'); hud();
}
$('chapters').addEventListener('click', e => {
  const lvBtn = e.target.closest('button[data-lv]');
  if (lvBtn) { audio(); begin(+lvBtn.dataset.lv); return; }
  const head = e.target.closest('button[data-ch]');
  if (head && !head.closest('.lock')) { const i = +head.dataset.ch; openChapter = openChapter === i ? -2 : i; chapterRows($('chapters'), false); tone(880, .08, 'triangle', .04); }
});
function begin(lv = level) {
  playing = lv;
  $('menu').classList.remove('show'); $('win').classList.remove('show');
  const ch = CHAPTERS[chapterOf(lv)];
  if (ch.feature && !seen.includes(ch.feature) && lv <= MAX_LEVEL) {
    seen.push(ch.feature); store.set('sw_seen', seen);
    $('introT').textContent = ch.title; $('introP').textContent = ch.text;
    state = 'intro'; drawDemo(ch.feature); $('intro').classList.add('show'); hud();
    return;
  }
  startLevel(lv);
}

// --- dotyk ---
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  const x = e.clientX, y = e.clientY;
  for (let j = 0; j < jars.length; j++) {
    const p = L.pos[j];
    if (x > p.x - 10 && x < p.x + L.jw + 10 && y > p.y - L.d * 1.4 && y < p.y + L.jh + 10) { tapJar(j); return; }
  }
  sel = -1;
});
$('undo').onclick = undo;
$('addJar').onclick = addJar;
$('hintBtn').onclick = useHint;
$('restart').onclick = () => { if (state === 'play') { startLevel(playing); tone(330, .15, 'triangle', .06); } };
$('menuBtn').onclick = () => { if (state === 'play') showMenu(); };
$('snd').onclick = () => { muted = !muted; store.set('sw_muted', muted); hud(); };
$('play').onclick = () => { audio(); begin(level); };
$('introGo').onclick = () => { $('intro').classList.remove('show'); startLevel(playing); };
$('next').onclick = () => begin(Math.min(playing + 1, level));
$('again').onclick = () => begin(playing);

// --- rysowanie ---
function fly(c2, x, y, c, t, r, lift = 0, asleep = false) {
  const bob = asleep ? 0 : Math.sin(t / 380 + x * .05 + y * .03) * r * .08;
  y += bob - lift;
  if (asleep) {
    c2.fillStyle = 'rgba(150,160,200,.22)'; c2.beginPath(); c2.arc(x, y, r * 1.15, 0, 7); c2.fill();
    c2.fillStyle = '#7d86ad'; c2.beginPath(); c2.arc(x, y, r * .55, 0, 7); c2.fill();
    c2.fillStyle = '#c8cdea'; c2.font = `800 ${r * .75}px system-ui, sans-serif`; c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillText('z', x + r * .8, y - r * .75);
    return;
  }
  const pulse = 1 + Math.sin(t / 520 + x * .1) * .06;
  const g = c2.createRadialGradient(x, y, 0, x, y, r * 2 * pulse);
  g.addColorStop(0, c); g.addColorStop(.32, c + 'b0'); g.addColorStop(1, c + '00');
  c2.fillStyle = g; c2.beginPath(); c2.arc(x, y, r * 2 * pulse, 0, 7); c2.fill();
  c2.fillStyle = '#ffffffd8'; c2.beginPath(); c2.arc(x, y, r * .42, 0, 7); c2.fill();
  c2.globalAlpha = .45 + Math.sin(t / 60 + x) * .2; c2.fillStyle = '#e8f0ff';
  c2.beginPath(); c2.ellipse(x - r * .55, y - r * .55, r * .38, r * .2, -.6, 0, 7); c2.fill();
  c2.beginPath(); c2.ellipse(x + r * .55, y - r * .55, r * .38, r * .2, .6, 0, 7); c2.fill();
  c2.globalAlpha = 1;
}

function jarPath(c2, x, y, w, h) {
  const r = w * .28, neck = w * .12;
  c2.beginPath();
  c2.moveTo(x + neck, y);
  c2.lineTo(x + neck, y + w * .18);
  c2.quadraticCurveTo(x, y + w * .22, x, y + w * .4);
  c2.lineTo(x, y + h - r);
  c2.quadraticCurveTo(x, y + h, x + r, y + h);
  c2.lineTo(x + w - r, y + h);
  c2.quadraticCurveTo(x + w, y + h, x + w, y + h - r);
  c2.lineTo(x + w, y + w * .4);
  c2.quadraticCurveTo(x + w, y + w * .22, x + w - neck, y + w * .18);
  c2.lineTo(x + w - neck, y);
}
// szkło: lekko niebieskie wypełnienie, cień na dnie, odblask z boku i obręcz szyjki
function glassBack(c2, x, y, w, h) {
  jarPath(c2, x, y, w, h);
  const g = c2.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, 'rgba(170,195,255,.13)'); g.addColorStop(.5, 'rgba(170,195,255,.04)'); g.addColorStop(1, 'rgba(170,195,255,.11)');
  c2.fillStyle = g; c2.fill();
  c2.fillStyle = 'rgba(0,0,0,.25)'; c2.beginPath(); c2.ellipse(x + w / 2, y + h + 5, w * .52, 5, 0, 0, 7); c2.fill();
}
function glassFront(c2, x, y, w, h, stroke, lw = 2) {
  jarPath(c2, x, y, w, h); c2.lineWidth = lw; c2.strokeStyle = stroke; c2.stroke();
  const hl = c2.createLinearGradient(0, y, 0, y + h);
  hl.addColorStop(0, 'rgba(255,255,255,.0)'); hl.addColorStop(.25, 'rgba(255,255,255,.22)'); hl.addColorStop(1, 'rgba(255,255,255,.03)');
  c2.fillStyle = hl; c2.beginPath(); c2.roundRect ? c2.roundRect(x + w * .13, y + w * .48, w * .08, h - w * .8, w * .04) : c2.rect(x + w * .13, y + w * .48, w * .08, h - w * .8); c2.fill();
  c2.strokeStyle = 'rgba(220,232,255,.45)'; c2.lineWidth = 1.5;
  c2.beginPath(); c2.moveTo(x + w * .12, y + 1); c2.lineTo(x + w * .88, y + 1); c2.stroke();
}
function frost(c2, x, y, w, h, alpha, left) {
  c2.save(); jarPath(c2, x, y, w, h); c2.clip();
  c2.globalAlpha = alpha;
  const g = c2.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, 'rgba(210,240,255,.75)'); g.addColorStop(1, 'rgba(150,200,240,.55)');
  c2.fillStyle = g; c2.fillRect(x, y, w, h);
  c2.strokeStyle = 'rgba(255,255,255,.7)'; c2.lineWidth = 1.2;
  for (let i = 0; i < 6; i++) { const yy = y + h * (.15 + i * .14); c2.beginPath(); c2.moveTo(x, yy); c2.lineTo(x + w * .3, yy - w * .2); c2.lineTo(x + w * .6, yy + w * .05); c2.lineTo(x + w, yy - w * .15); c2.stroke(); }
  c2.restore();
  if (left > 0) {
    c2.globalAlpha = alpha;
    c2.fillStyle = '#0d1640'; c2.beginPath(); c2.arc(x + w / 2, y + h / 2, w * .3, 0, 7); c2.fill();
    c2.fillStyle = '#d6f0ff'; c2.font = `800 ${w * .26}px system-ui, sans-serif`; c2.textAlign = 'center'; c2.textBaseline = 'middle';
    c2.fillText('❄' + left, x + w / 2, y + h / 2 + 1);
    c2.globalAlpha = 1;
  }
}

function draw(t) {
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  drawAmbient(t);
  if (state === 'menu' || state === 'intro' || !jars.length) { drawMenuFlies(t); return; }
  const { jw, jh, d } = L;
  const cel = state === 'celebrate' || state === 'win' ? Math.min(1, (t - celebrateT) / 900) : 0;
  for (let j = 0; j < jars.length; j++) {
    let { x, y } = L.pos[j];
    const sh = shakes.get(j);
    if (sh) { const k = (t - sh) / 300; if (k > 1) shakes.delete(j); else x += Math.sin(k * 30) * 6 * (1 - k); }
    const A = jars[j], full = isFull(A);
    const gl = glows.get(j), glowK = full ? .5 + .5 * Math.sin(t / 500 + j) : 0;
    if (full) {
      const c = COLORS[A[0]], rr = jh * (.9 + cel * .5), gg = ctx.createRadialGradient(x + jw / 2, y + jh / 2, 0, x + jw / 2, y + jh / 2, rr);
      gg.addColorStop(0, c + (cel ? '66' : '40')); gg.addColorStop(1, c + '00');
      ctx.fillStyle = gg; ctx.fillRect(x - rr, y + jh / 2 - rr, jw + rr * 2, rr * 2);
    }
    glassBack(ctx, x, y, jw, jh);
    for (let s = 0; s < A.length; s++) {
      if (hidden.has(j + ':' + s)) continue;
      const p = slotXY(j, s);
      const lift = sel === j && s === A.length - 1 ? (p.y - y) + d * .7 : 0;
      fly(ctx, p.x + (x - L.pos[j].x), p.y, COLORS[A[s]], t, d * .36, lift, mask[j][s]);
    }
    let stroke = `rgba(190,210,255,${.35 + glowK * .3})`, lw = 2;
    if (sel === j) { stroke = 'rgba(255,230,140,.95)'; lw = 2.5; }
    if (hint && (hint.a === j || hint.b === j)) { const k = .55 + .45 * Math.sin((t - hint.t0) / 160); stroke = `rgba(92,242,255,${k})`; lw = 3; }
    glassFront(ctx, x, y, jw, jh, stroke, lw);
    if (j === fz) {
      const fr = frozenNow(j), k = thawT ? Math.max(0, 1 - (t - thawT) / 700) : 1;
      if (fr || k > 0) frost(ctx, x, y, jw, jh, fr ? 1 : k, fr ? need - fullCount(jars, fz) : 0);
    }
    if (full) {
      const k = gl ? Math.min(1, (t - gl) / 300) : 1;
      const lw2 = jw * .82, lx = x + (jw - lw2) / 2, ly = y - 9 - (1 - k) * 30;
      ctx.globalAlpha = k;
      const lg = ctx.createLinearGradient(0, ly, 0, ly + 11); lg.addColorStop(0, '#e0b45e'); lg.addColorStop(1, '#a87a34');
      ctx.fillStyle = lg; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(lx, ly, lw2, 11, 4) : ctx.rect(lx, ly, lw2, 11); ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  // strzałka podpowiedzi
  if (hint && state === 'play') {
    const a = L.pos[hint.a], b = L.pos[hint.b], k = ((t - hint.t0) / 900) % 1;
    const ax = a.x + jw / 2, ay = a.y - d * .9, bx = b.x + jw / 2, by = b.y - d * .9, hy = Math.min(ay, by) - d * 1.4;
    ctx.strokeStyle = 'rgba(92,242,255,.75)'; ctx.lineWidth = 2.5; ctx.setLineDash([6, 7]); ctx.lineDashOffset = -k * 26;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.quadraticCurveTo((ax + bx) / 2, hy, bx, by); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(92,242,255,.9)'; ctx.beginPath(); ctx.moveTo(bx, by + 6); ctx.lineTo(bx - 7, by - 6); ctx.lineTo(bx + 7, by - 6); ctx.fill();
  }
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i];
    const k = (t - f.t0) / f.dur;
    if (k < 0) continue;
    if (k >= 1) { flying.splice(i, 1); landed(f); continue; }
    const e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const hop = Math.min(f.p0.y, f.p1.y) - L.d * 1.6;
    const x = f.p0.x + (f.p1.x - f.p0.x) * e;
    const y = (1 - e) * (1 - e) * f.p0.y + 2 * (1 - e) * e * hop + e * e * f.p1.y;
    fly(ctx, x, y, COLORS[f.c], t, d * .36);
  }
  // rozbłyski po ruchu
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i], k = (t - r.t0) / 450;
    if (k >= 1) { rings.splice(i, 1); continue; }
    ctx.globalAlpha = (1 - k) * .9; ctx.strokeStyle = r.c; ctx.lineWidth = 2.5 * (1 - k) + .5;
    ctx.beginPath(); ctx.arc(r.x, r.y, d * (.35 + k * .7), 0, 7); ctx.stroke();
  }
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += p.up ? -.01 : .06; p.life -= .016;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.up ? 2.8 : 2.2, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

const menuFlies = Array.from({ length: 22 }, (_, i) => ({ c: COLORS[i % 8], a: Math.random() * 7, s: .3 + Math.random() * .6, r: .25 + Math.random() * .3 }));
function drawMenuFlies(t) {
  for (const f of menuFlies) {
    const x = W / 2 + Math.cos(t / 2400 * f.s + f.a) * W * f.r * 1.4;
    const y = H / 2 + Math.sin(t / 1700 * f.s + f.a * 2) * H * f.r;
    fly(ctx, x, y, f.c, t, 7);
  }
}

// mały obrazek na ekranie „Nowość”
function drawDemo(f) {
  const c = $('demo').getContext('2d'), w = 70, h = 190, d = 40;
  c.clearRect(0, 0, 320, 240);
  const jar = (x, cols, sleep, fr) => {
    glassBack(c, x, 30, w, h);
    cols.forEach((col, s) => fly(c, x + w / 2, 30 + h - d * .62 - s * d * .98, COLORS[col], 0, d * .36, 0, sleep[s]));
    glassFront(c, x, 30, w, h, 'rgba(190,210,255,.6)');
    if (fr) frost(c, x, 30, w, h, 1, 1);
  };
  if (f === 'hidden') { jar(70, [2, 1, 4, 0], [true, true, false, false]); jar(180, [0, 0], [false, false]); }
  else { jar(70, [3, 3, 3, 3], [], false); jar(180, [1, 4, 2, 5], [], true); }
}

function applyTexts() {
  document.title = tr('Świetliki', 'Firefly Jars');
  $('title').textContent = tr('Świetliki', 'Firefly Jars');
  $('tagline').textContent = tr('Magiczna łamigłówka', 'A glowing puzzle');
  $('howto').textContent = tr('Przenoś świetliki między słoikami. Do świetlika możesz dołożyć tylko taki sam kolor. Zbierz każdy kolor w osobnym słoiku!',
    'Move fireflies between jars. A firefly can only go on top of the same colour or into an empty jar. Gather each colour in its own jar!');
  $('lvlL').textContent = tr('Poziom', 'Level'); $('movesL').textContent = tr('Ruchy', 'Moves'); $('progL').textContent = tr('Postęp', 'Progress');
  $('undoL').textContent = tr('Cofnij', 'Undo'); $('restartL').textContent = tr('Od nowa', 'Restart');
  $('hintL').textContent = tr('Podpowiedź', 'Hint'); $('jarL').textContent = tr('Słoik', 'Jar');
  $('newL').textContent = tr('Nowość', 'New'); $('introGo').textContent = tr('Rozumiem', 'Got it');
  $('wMovesL').textContent = tr('Ruchy', 'Moves'); $('wParL').textContent = tr('Na 3 ★', 'For 3 ★'); $('wTotalL').textContent = tr('Gwiazdki', 'Stars');
  $('next').textContent = tr('Następny poziom', 'Next level'); $('againL').textContent = tr('Zagraj jeszcze raz', 'Play again');
  $('snd').setAttribute('aria-label', tr('Dźwięk', 'Sound'));
}
applyTexts();

function loop(t) { draw(t); requestAnimationFrame(loop); }
resize(); showMenu(); requestAnimationFrame(loop);
document.addEventListener('visibilitychange', () => { if (document.hidden && actx) actx.suspend(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
